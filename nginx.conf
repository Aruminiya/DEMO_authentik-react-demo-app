server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routes (e.g. /dashboard, /login) have no
    # matching file on disk — always fall back to index.html and let the
    # SPA's router handle it, instead of returning a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
